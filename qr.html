<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB® Exam Simulator — QR</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  sup.tm{font-size:.55em;vertical-align:super;line-height:0;font-weight:600;}
  body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#94B5C2 0%,#6B95A5 100%);
    color:#1A2A35;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:'ISTQB PRACTICE HUB';
    position:absolute;
    top:5%;left:50%;
    transform:translateX(-50%) rotate(-3deg);
    font-size:6rem;font-weight:900;
    color:rgba(255,255,255,.10);
    letter-spacing:.02em;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
    line-height:1;
  }
  body::after{
    content:'ISTQB PRACTICE HUB';
    position:absolute;
    bottom:5%;left:50%;
    transform:translateX(-50%) rotate(-3deg);
    font-size:6rem;font-weight:900;
    color:rgba(255,255,255,.10);
    letter-spacing:.02em;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
    line-height:1;
  }
  .card{
    background:#fff;
    border-radius:22px;
    padding:28px 32px 24px;
    text-align:center;
    box-shadow:0 8px 36px rgba(0,0,0,.20);
    max-width:420px;width:100%;
    position:relative;z-index:1;
  }
  .brand-row{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:14px;
    font-size:11px;font-weight:800;
    color:#3B6B7B;
    text-transform:uppercase;letter-spacing:.16em;
  }
  .brand-row::before, .brand-row::after{
    content:'';display:block;height:2px;width:22px;background:#3B6B7B;border-radius:2px;
  }
  h1{
    font-size:24px;font-weight:900;
    line-height:1.15;
    margin-bottom:6px;
    text-transform:uppercase;
    color:#1A2A35;
    letter-spacing:-.005em;
  }
  h1 .accent{
    background:#3B6B7B;color:#fff;
    padding:1px 10px;border-radius:8px;
    display:inline-block;
  }
  p.sub{
    color:#5B6E78;font-size:13px;font-weight:600;
    margin-bottom:18px;
    line-height:1.45;
    max-width:340px;margin-left:auto;margin-right:auto;
  }
  #qr-wrap{
    display:inline-block;
    padding:12px;
    background:#fff;
    border:2.5px solid #3B6B7B;
    border-radius:16px;
    margin-bottom:16px;
    box-shadow:0 4px 0 rgba(59,107,123,.18);
  }
  #qr-wrap canvas, #qr-wrap img{display:block;border-radius:4px;}
  a.url{
    display:inline-block;
    font-family:'Nunito',monospace;
    font-size:12px;font-weight:700;
    color:#3B6B7B;
    word-break:break-all;
    background:#EAF1F4;
    border:1.5px solid #C7D9E0;
    border-radius:99px;
    padding:7px 16px;
    text-decoration:none;
    transition:background .15s,border-color .15s,transform .12s;
  }
  a.url:hover{background:#D4E3E9;border-color:#3B6B7B;transform:translateY(-1px);}
  .footer-tag{
    margin-top:16px;
    padding-top:14px;
    border-top:1.5px dashed #D4DFE4;
    font-size:10px;font-weight:800;
    color:#7B8E97;
    text-transform:uppercase;letter-spacing:.18em;
  }
  .footer-tag .dot{
    display:inline-block;
    width:4px;height:4px;border-radius:50%;
    background:#3B6B7B;
    vertical-align:middle;
    margin:0 5px 2px;
  }
  @media (max-width:560px){
    body::before, body::after{font-size:3.8rem;}
    .card{padding:22px 18px 20px;}
    h1{font-size:20px;}
    p.sub{font-size:12px;}
    .brand-row{font-size:10px;}
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand-row">Exactpro <span>·</span> ISTQB Practice</div>
  <h1>Scan to <span class="accent">Play</span></h1>
  <p class="sub">Open the ISTQB<sup class="tm">®</sup> Exam Simulator on your phone — practice CTFL, CT-AI, and CT-GenAI.</p>
  <div id="qr-wrap"></div>
  <a class="url" id="url-link" href="#" target="_blank" rel="noopener"></a>
  <div class="footer-tag">Test your skills <span class="dot"></span> Win prizes</div>
</div>
<script>
  const TARGET = 'https://exactpro.github.io/istqb-practice-hub/';
  document.getElementById('url-link').href = TARGET;
  document.getElementById('url-link').textContent = TARGET;
  const img = document.createElement('img');
  img.alt = 'QR code for ' + TARGET;
  img.width = 240; img.height = 240;
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=' + encodeURIComponent(TARGET);
  img.onerror = () => { document.getElementById('qr-wrap').textContent = 'Failed to load QR image. Check network connection.'; };
  document.getElementById('qr-wrap').appendChild(img);
</script>
</body>
</html>
