<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB® Exam Simulator — QR</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  sup.tm{font-size:.5em;vertical-align:super;line-height:0;font-weight:600;}
  body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    background:#f0f2f5;
    color:#111827;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .card{
    background:#fff;
    border-radius:24px;
    padding:48px 40px;
    text-align:center;
    box-shadow:0 4px 24px rgba(0,0,0,.08);
    max-width:480px;width:100%;
  }
  h1{
    font-size:24px;font-weight:800;
    margin-bottom:8px;
  }
  p.sub{
    color:#6b7280;font-size:14px;
    margin-bottom:28px;
  }
  #qr{
    display:inline-block;
    padding:20px;
    background:#fff;
    border:2px solid #e5e7eb;
    border-radius:16px;
    margin-bottom:24px;
  }
  #qr canvas, #qr img{display:block;}
  .url{
    font-family:monospace;
    font-size:13px;
    color:#1d4ed8;
    word-break:break-all;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px 14px;
  }
  a.url{text-decoration:none;display:block;}
  a.url:hover{background:#e8f7ff;border-color:#1cb0f6;}
</style>
</head>
<body>
<div class="card">
  <h1>ISTQB<sup class="tm">®</sup> Exam Simulator</h1>
  <p class="sub">Scan to open the quiz hub on your phone</p>
  <div id="qr"></div>
  <a class="url" id="url-link" href="#" target="_blank" rel="noopener"></a>
</div>
<script>
  const TARGET = 'https://exactpro.github.io/istqb-practice-hub/';
  document.getElementById('url-link').href = TARGET;
  document.getElementById('url-link').textContent = TARGET;
  const img = document.createElement('img');
  img.alt = 'QR code for ' + TARGET;
  img.width = 320; img.height = 320;
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=10&data=' + encodeURIComponent(TARGET);
  img.onerror = () => { document.getElementById('qr').textContent = 'Failed to load QR image. Check network connection.'; };
  document.getElementById('qr').appendChild(img);
</script>
</body>
</html>
